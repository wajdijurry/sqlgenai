<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6200ea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00e676;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#9d46ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00b248;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="#f5f7fa" />
  
  <!-- Brain outline -->
  <g transform="translate(400, 300) scale(0.8)">
    <path d="M0,-150 C-80,-150 -150,-80 -150,0 C-150,80 -80,150 0,150 C80,150 150,80 150,0 C150,-80 80,-150 0,-150 Z" 
          fill="#ffffff" stroke="#6200ea" stroke-width="8" />
    
    <!-- Neural network connections -->
    <g stroke="#9d46ff" stroke-width="3">
      <!-- Left hemisphere connections -->
      <line x1="-120" y1="-80" x2="-60" y2="-40" />
      <line x1="-120" y1="-40" x2="-60" y2="-80" />
      <line x1="-120" y1="0" x2="-60" y2="-40" />
      <line x1="-120" y1="40" x2="-60" y2="0" />
      <line x1="-120" y1="80" x2="-60" y2="40" />
      <line x1="-60" y1="-80" x2="-60" y2="80" />
      <line x1="-60" y1="-80" x2="0" y2="-40" />
      <line x1="-60" y1="-40" x2="0" y2="0" />
      <line x1="-60" y1="0" x2="0" y2="40" />
      <line x1="-60" y1="40" x2="0" y2="80" />
      <line x1="-60" y1="80" x2="0" y2="40" />
      
      <!-- Right hemisphere connections -->
      <line x1="120" y1="-80" x2="60" y2="-40" />
      <line x1="120" y1="-40" x2="60" y2="-80" />
      <line x1="120" y1="0" x2="60" y2="-40" />
      <line x1="120" y1="40" x2="60" y2="0" />
      <line x1="120" y1="80" x2="60" y2="40" />
      <line x1="60" y1="-80" x2="60" y2="80" />
      <line x1="60" y1="-80" x2="0" y2="-40" />
      <line x1="60" y1="-40" x2="0" y2="0" />
      <line x1="60" y1="0" x2="0" y2="40" />
      <line x1="60" y1="40" x2="0" y2="80" />
      <line x1="60" y1="80" x2="0" y2="40" />
      
      <!-- Cross-hemisphere connections -->
      <line x1="-60" y1="-40" x2="60" y2="-40" />
      <line x1="-60" y1="0" x2="60" y2="0" />
      <line x1="-60" y1="40" x2="60" y2="40" />
    </g>
    
    <!-- Neural nodes -->
    <g>
      <!-- Left hemisphere nodes -->
      <circle cx="-120" cy="-80" r="10" fill="#00e676" />
      <circle cx="-120" cy="-40" r="10" fill="#00e676" />
      <circle cx="-120" cy="0" r="10" fill="#00e676" />
      <circle cx="-120" cy="40" r="10" fill="#00e676" />
      <circle cx="-120" cy="80" r="10" fill="#00e676" />
      
      <circle cx="-60" cy="-80" r="10" fill="#00e676" />
      <circle cx="-60" cy="-40" r="10" fill="#00e676" />
      <circle cx="-60" cy="0" r="10" fill="#00e676" />
      <circle cx="-60" cy="40" r="10" fill="#00e676" />
      <circle cx="-60" cy="80" r="10" fill="#00e676" />
      
      <!-- Central nodes -->
      <circle cx="0" cy="-40" r="10" fill="url(#grad1)" />
      <circle cx="0" cy="0" r="15" fill="url(#grad1)" />
      <circle cx="0" cy="40" r="10" fill="url(#grad1)" />
      <circle cx="0" cy="80" r="10" fill="url(#grad1)" />
      
      <!-- Right hemisphere nodes -->
      <circle cx="60" cy="-80" r="10" fill="#6200ea" />
      <circle cx="60" cy="-40" r="10" fill="#6200ea" />
      <circle cx="60" cy="0" r="10" fill="#6200ea" />
      <circle cx="60" cy="40" r="10" fill="#6200ea" />
      <circle cx="60" cy="80" r="10" fill="#6200ea" />
      
      <circle cx="120" cy="-80" r="10" fill="#6200ea" />
      <circle cx="120" cy="-40" r="10" fill="#6200ea" />
      <circle cx="120" cy="0" r="10" fill="#6200ea" />
      <circle cx="120" cy="40" r="10" fill="#6200ea" />
      <circle cx="120" cy="80" r="10" fill="#6200ea" />
    </g>
  </g>
  
  <!-- Text -->
  <text x="400" y="500" font-family="Arial" font-size="32" font-weight="bold" text-anchor="middle" fill="url(#grad2)">
    AI-Powered Database Intelligence
  </text>
</svg>
